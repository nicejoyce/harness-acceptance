version: 1
project:
  name: enterprise-development-harness
  owner: engineering
  data_classification: internal
commands:
  dependency-setup:
    executable: npm
    args:
      - ci
      - --ignore-scripts
    cwd: .
    timeout_seconds: 300
  format:
    executable: node
    args:
      - --check
      - harness-cli/src/contracts.ts
    cwd: .
    timeout_seconds: 60
  lint:
    executable: npm
    args:
      - run
      - typecheck
    cwd: .
    timeout_seconds: 120
  typecheck:
    executable: npm
    args:
      - run
      - typecheck
    cwd: .
    timeout_seconds: 120
  unit-test:
    executable: npx
    args:
      - --no-install
      - c8
      - --reporter=json
      - --report-dir=coverage
      - npm
      - test
    cwd: .
    timeout_seconds: 300
  integration-test:
    executable: node
    args:
      - --test
      - harness-cli/test/workflow.test.ts
    cwd: .
    timeout_seconds: 300
  e2e-test:
    executable: node
    args:
      - --test
      - harness-cli/test/workflow.test.ts
    cwd: .
    timeout_seconds: 300
  build:
    executable: npm
    args:
      - run
      - typecheck
    cwd: .
    timeout_seconds: 120
  security-scan:
    executable: npm
    args:
      - audit
      - --offline
      - --audit-level=high
    cwd: .
    timeout_seconds: 120
  control-plane-integrity:
    executable: node
    args:
      - harness-cli/src/cli.ts
      - control-plane
      - verify
      - --baseline-root
      - .
      - --candidate-root
      - ../project
      - --json
    cwd: .
    execution_root: trusted-harness
    timeout_seconds: 120
  changed-line-coverage:
    executable: node
    args:
      - harness-cli/src/cli.ts
      - coverage
      - verify
      - --project-root
      - ../project
      - --base-env
      - BASE_SHA
      - --head-env
      - HEAD_SHA
      - --report
      - ../project/coverage/coverage-final.json
      - --json
    cwd: .
    execution_root: trusted-harness
    timeout_seconds: 120
    inherited_environment:
      - BASE_SHA
      - HEAD_SHA
  regression-proof:
    executable: node
    args:
      - harness-cli/src/cli.ts
      - regression-proof
      - verify
      - --root
      - .
      - --project-root
      - ../project
      - --base-env
      - BASE_SHA
      - --head-env
      - HEAD_SHA
      - --json
    cwd: .
    execution_root: trusted-harness
    timeout_seconds: 600
    inherited_environment:
      - BASE_SHA
      - HEAD_SHA
  mutation-smoke:
    executable: npm
    args:
      - run
      - mutation:smoke
    cwd: .
    timeout_seconds: 1800
approvals:
  roles:
    engineering:
      - Miziky2000-netizen
    security:
      - Miziky2000-netizen
    data:
      - Miziky2000-netizen
    api:
      - Miziky2000-netizen
    frontend:
      - Miziky2000-netizen
    platform:
      - Miziky2000-netizen
    sre:
      - Miziky2000-netizen
