name: Harness Platform Audit

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  full-platform-audit:
    name: full-platform-audit-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: win32
            runner: windows-latest
          - platform: darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Harden runner network policy
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - name: Checkout trusted Harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install trusted dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Run complete platform test suite
        run: npm test

  full-mutation:
    name: full-mutation
    needs: full-platform-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner network policy
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - name: Checkout trusted Harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install trusted dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Run scheduled full mutation suite
        run: npm run mutation:full
