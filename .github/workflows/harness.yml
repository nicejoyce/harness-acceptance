name: Enterprise Harness

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions: {}

jobs:
  prepare-context:
    name: harness-prepare-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout pull request Git data without executing it
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: project
          persist-credentials: false
      - name: Checkout trusted Harness from the protected base revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-harness
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trusted-harness/package-lock.json
      - name: Install trusted Harness dependencies
        run: npm ci --prefix trusted-harness
      - name: Build immutable plan and approvals
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          mkdir -p prepared
          node trusted-harness/harness-cli/src/cli.ts validate --root trusted-harness/harness
          node trusted-harness/harness-cli/src/cli.ts plan --root trusted-harness/harness --project-root project --repository "$GH_REPOSITORY" --pull-request "$PR_NUMBER" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --git-base "$BASE_SHA" --git-head "$HEAD_SHA" --operation merge --environment test --risk-labels-json "$PR_LABELS_JSON" --output prepared/plan.json
          gh api --paginate "repos/$GH_REPOSITORY/pulls/$PR_NUMBER/reviews" | jq -s 'add' > prepared/reviews.json
          node trusted-harness/harness-cli/src/cli.ts approvals github --root trusted-harness/harness --project-root project --repository "$GH_REPOSITORY" --pull-request "$PR_NUMBER" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --plan prepared/plan.json --reviews prepared/reviews.json --output prepared/approvals.json
          git -C project bundle create ../prepared/project.bundle "$BASE_SHA" "$HEAD_SHA"
      - name: Upload trusted execution inputs
        uses: actions/upload-artifact@v4
        with:
          name: harness-prepared
          path: |
            prepared
            trusted-harness
          if-no-files-found: error

  harness:
    name: harness-${{ matrix.os }}
    needs: prepare-context
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download trusted execution inputs
        uses: actions/download-artifact@v4
        with:
          name: harness-prepared
          path: .
      - name: Recreate a clean pull request checkout
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git clone prepared/project.bundle project
          git -C project checkout --detach "$HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trusted-harness/package-lock.json
      - name: Install trusted Harness dependencies
        run: npm ci --prefix trusted-harness
      - name: Run project commands without GitHub credentials
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node trusted-harness/harness-cli/src/cli.ts run --root trusted-harness/harness --project-root project --repository "$GH_REPOSITORY" --pull-request "$PR_NUMBER" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --github-repository "$GH_REPOSITORY" --github-run-id "$GITHUB_RUN_ID" --github-run-attempt "$GITHUB_RUN_ATTEMPT" --github-workflow-ref "$GITHUB_WORKFLOW_REF" --github-event-name "$GITHUB_EVENT_NAME" --plan prepared/plan.json --approvals prepared/approvals.json --output evidence
      - name: Upload Harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-evidence-${{ matrix.os }}
          path: evidence
          if-no-files-found: error

  harness-final:
    name: harness-final
    if: always()
    needs: [prepare-context, harness]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Checkout pull request Git data without executing it
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: project
          persist-credentials: false
      - name: Checkout trusted Harness from the protected base revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-harness
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trusted-harness/package-lock.json
      - name: Install trusted Harness dependencies
        run: npm ci --prefix trusted-harness
      - name: Download prepared plan
        uses: actions/download-artifact@v4
        with:
          name: harness-prepared
          path: trusted-inputs
      - name: Download all untrusted evidence
        uses: actions/download-artifact@v4
        with:
          pattern: harness-evidence-*
          path: evidence
      - name: Recompute and sign the final result
        id: aggregate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_CONCLUSION: ${{ needs.harness.result }}
          HARNESS_ED25519_PRIVATE_KEY_B64: ${{ secrets.HARNESS_ED25519_PRIVATE_KEY_B64 }}
          HARNESS_ED25519_PUBLIC_KEYS_JSON: ${{ vars.HARNESS_ED25519_PUBLIC_KEYS_JSON }}
          HARNESS_ED25519_PUBLIC_KEY_B64: ${{ vars.HARNESS_ED25519_PUBLIC_KEY_B64 }}
        run: |
          gh api --paginate "repos/$GH_REPOSITORY/pulls/$PR_NUMBER/reviews" | jq -s 'add' > current-reviews.json
          node trusted-harness/harness-cli/src/cli.ts approvals github --root trusted-harness/harness --project-root project --repository "$GH_REPOSITORY" --pull-request "$PR_NUMBER" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --plan trusted-inputs/prepared/plan.json --reviews current-reviews.json --output expected-approvals.json
          MANIFEST_ARGS=()
          while IFS= read -r manifest; do MANIFEST_ARGS+=(--manifest "$manifest"); done < <(find evidence -name manifest.json -type f -print | sort)
          node trusted-harness/harness-cli/src/cli.ts final aggregate --root trusted-harness/harness --project-root project --repository "$GH_REPOSITORY" --pull-request "$PR_NUMBER" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" "${MANIFEST_ARGS[@]}" --expected-approvals expected-approvals.json --job-conclusion "$JOB_CONCLUSION" --output final.signed.json
          node trusted-harness/harness-cli/src/cli.ts final verify --input final.signed.json
      - name: Publish harness-final Check
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
        run: |
          if [[ "$AGGREGATE_OUTCOME" == "success" && -f final.signed.json ]]; then
            RESULT=$(node -e "const f=require('./final.signed.json'); process.stdout.write(f.payload.result)")
            SUMMARY=$(node -e "const f=require('./final.signed.json'); const p=f.payload; process.stdout.write(['Result: '+p.result,'Repository: '+p.context.repository,'Pull request: '+p.context.pull_request,'Head SHA: '+p.context.head_sha,'Plan SHA-256: '+p.plan_sha256,'Evidence: '+p.evidence.map((item)=>item.platform+':'+item.manifest_sha256).join(', '),'Signing key ID: '+f.key_id].join('\\n'))")
          else
            RESULT=failed
            SUMMARY=$(printf 'Result: failed\nRepository: %s\nPull request: %s\nHead SHA: %s\nSigned final result unavailable' "$GH_REPOSITORY" "$PR_NUMBER" "$HEAD_SHA")
          fi
          if [[ "$RESULT" == "passed" ]]; then CONCLUSION=success; else CONCLUSION=failure; fi
          gh api --method POST "repos/$GH_REPOSITORY/check-runs" -f name=harness-final -f head_sha="$HEAD_SHA" -f status=completed -f conclusion="$CONCLUSION" -f 'output[title]=Enterprise Harness final result' -f "output[summary]=$SUMMARY"
          [[ "$CONCLUSION" == "success" ]]
      - name: Upload signed final result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-final-signed
          path: final.signed.json
          if-no-files-found: warn
