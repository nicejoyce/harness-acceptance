版本: 2
等级:
  BLOCKER: 不可豁免，违反时停止合并、发布或操作。
  REQUIRED: 默认阻断；仅可依据例外策略限期放行。
  CONDITIONAL: 适用条件满足时必须执行。
阈值:
  变更行覆盖率最低: 80
  关键安全模块覆盖率最低: 90
  圈复杂度最高: 10
  嵌套层级最高: 3
  单函数行数最高: 80
  单文件行数最高: 500
  例外最长有效天数: 30
阻断策略:
  高危或严重依赖漏洞: BLOCKER
  必需测试失败或跳过: REQUIRED
  未提供完成证据: REQUIRED
  未经批准的生产或第三方副作用: BLOCKER
适配规则:
  - 技术栈适配只能加严，不得降低通用基线。
  - 工具命令由 project-profile.yaml 绑定；未配置的检查必须明确标为不适用或走例外流程。
